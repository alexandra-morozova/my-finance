services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      # Host 5433: another local Postgres already binds 5432.
      - "5433:5432"
    environment:
      POSTGRES_USER: myfinance
      POSTGRES_PASSWORD: myfinance
      POSTGRES_DB: myfinance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfinance -d myfinance"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
